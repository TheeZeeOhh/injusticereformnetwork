[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.71"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0-rc.13", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.0.0-rc.17", features = [] }
tauri-plugin-log = "2.0.0-rc"
# OS credential store (Secret Service / libsecret on Linux) for per-install
# vault salts. Salts are non-secret but must live outside webview-accessible
# storage; the keychain is the correct home for them under Design A.
keyring = "4"
# USB token presence detection for the hardware dead-man's switch. Links the
# system libusb-1.0. Used only to enumerate device VID:PID — never to read data
# off the token.
rusb = "0.9"
# HTTP client for backend-side model downloads (Audio Intake / Whisper). Fetching
# from Rust bypasses the tauri://localhost CORS/origin restriction that blocks
# the frontend from following HuggingFace's Xet CDN redirect. Already in the tree
# transitively via Tauri. rustls-tls avoids a system OpenSSL dependency.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json"] }

# Linux desktop only: WebKitGTK, to grant the microphone (getUserMedia) permission
# the webview otherwise denies by default. Version pinned to what Tauri/wry links.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_16"] }
