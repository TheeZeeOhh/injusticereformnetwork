<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="IRN Browser">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12273d"/>
      <stop offset="1" stop-color="#0b1a2b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ab8ff"/>
      <stop offset="1" stop-color="#4d86c8"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)" stroke="#16324d" stroke-width="3"/>

  <!-- Protective shield -->
  <path d="M128 40 L196 66 V128 C196 172 166 202 128 218 C90 202 60 172 60 128 V66 Z"
        fill="#10273d" stroke="url(#shield)" stroke-width="6" stroke-linejoin="round"/>

  <!-- Globe inside the shield: the 'browser' motif, cradius 40 centered at (128,132) -->
  <g fill="none" stroke="#7ab8ff" stroke-width="4.5" stroke-linecap="round">
    <circle cx="128" cy="132" r="40"/>
    <!-- latitude -->
    <line x1="88" y1="132" x2="168" y2="132"/>
    <path d="M92 112 H164" opacity="0.85"/>
    <path d="M92 152 H164" opacity="0.85"/>
    <!-- longitude (meridians as ellipses) -->
    <ellipse cx="128" cy="132" rx="16" ry="40"/>
  </g>

  <!-- Lock notch: privacy accent at the shield crest -->
  <g fill="#7ab8ff">
    <rect x="120" y="70" width="16" height="12" rx="2"/>
    <path d="M122 70 v-4 a6 6 0 0 1 12 0 v4" fill="none" stroke="#7ab8ff" stroke-width="4"/>
  </g>
</svg>
