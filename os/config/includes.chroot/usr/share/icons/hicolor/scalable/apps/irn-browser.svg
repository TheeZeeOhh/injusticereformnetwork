<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="IRN Browser">
  <defs>
    <!-- Deep IRN blue-black badge, lit from top-left. -->
    <radialGradient id="badge" cx="0.32" cy="0.28" r="0.95">
      <stop offset="0" stop-color="#173352"/>
      <stop offset="0.55" stop-color="#0f2338"/>
      <stop offset="1" stop-color="#081524"/>
    </radialGradient>
    <!-- Aurora sweep for the orbit ring. -->
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd0ff"/>
      <stop offset="0.5" stop-color="#7ab8ff"/>
      <stop offset="1" stop-color="#4d86c8"/>
    </linearGradient>
    <radialGradient id="globefill" cx="0.38" cy="0.34" r="0.85">
      <stop offset="0" stop-color="#14304c"/>
      <stop offset="1" stop-color="#0c2036"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Badge -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#badge)" stroke="#25476b" stroke-width="2.5"/>
  <!-- top-edge sheen -->
  <rect x="20" y="18" width="216" height="96" rx="48" fill="#ffffff" opacity="0.04"/>

  <!-- Globe -->
  <g transform="translate(128 128)">
    <circle r="58" fill="url(#globefill)" stroke="#7ab8ff" stroke-width="3.5"/>
    <!-- graticule: kept minimal so it survives at menu size -->
    <g fill="none" stroke="#7ab8ff" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <line x1="-58" y1="0" x2="58" y2="0"/>
      <path d="M-52 -26 H52" opacity="0.6"/>
      <path d="M-52 26 H52" opacity="0.6"/>
      <ellipse rx="24" ry="58"/>
    </g>

    <!-- Orbit ring — the motion/web motif, angled and glowing -->
    <g transform="rotate(-24)" filter="url(#glow)">
      <ellipse rx="86" ry="34" fill="none" stroke="url(#orbit)" stroke-width="6.5"/>
      <!-- traveller node on the orbit -->
      <circle cx="86" cy="0" r="8" fill="#bfe2ff"/>
    </g>
  </g>
</svg>
