// IRN Browser autoconfig. The FIRST line MUST be a comment — Firefox ignores it.
// Loaded via defaults/pref/local-settings.js. Sets what the enterprise policy
// (policies.json) cannot express: the dark UI, forced dark page rendering, the
// userChrome stylesheet, and the privacy prefs with no policy equivalent.
//
//   defaultPref() = a changeable default — the user can flip it in Settings or
//                   about:config. Use for taste and for anything that might
//                   break a site the caseworker actually needs.
//   lockPref()    = enforced, greyed out in the UI. Use for the posture claims
//                   the command center and BROWSER.md make in writing.

// =============================================================================
// Dark mode — the browser UI (chrome)
// =============================================================================
// 0 = dark, 1 = light, 2 = system. Ship dark by default; user can change.
defaultPref("browser.theme.toolbar-theme", 0);
defaultPref("browser.theme.content-theme", 0);
defaultPref("extensions.activeThemeID", "firefox-compact-dark@mozilla.org");
defaultPref("browser.uidensity", 1);          // compact toolbars
defaultPref("browser.compactmode.show", true);

// --- Dark mode: page content -------------------------------------------------
// Tell every site the user prefers a dark color scheme (0 = dark). Sites with a
// dark theme honor it. For sites without one, Dark Reader (force-installed, see
// policies.json) does full page darkening.
defaultPref("layout.css.prefers-color-scheme.content-override", 0);
defaultPref("browser.in-content.dark-mode", true);
defaultPref("ui.systemUsesDarkTheme", 1);

// --- Enable userChrome.css / userContent.css (shipped alongside) --------------
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);

// =============================================================================
// Anti-phishing / "read the URL you are actually on"
// =============================================================================
// A browser used to fight cases gets spearphished. These make a hostile URL
// legible instead of pretty.
lockPref("network.IDN_show_punycode", true);          // xn-- instead of homoglyphs
defaultPref("browser.urlbar.trimURLs", false);        // show the full scheme + path
defaultPref("browser.urlbar.trimHttps", false);
lockPref("security.insecure_connection_text.enabled", true);       // "Not secure" in words
lockPref("security.insecure_connection_text.pbmode.enabled", true);

// =============================================================================
// Privacy the policy schema doesn't cover
// =============================================================================
lockPref("privacy.globalprivacycontrol.enabled", true);
lockPref("privacy.globalprivacycontrol.functionality.enabled", true);
lockPref("privacy.fingerprintingProtection", true);
lockPref("beacon.enabled", false);
lockPref("browser.send_pings", false);
lockPref("network.captive-portal-service.enabled", false);
lockPref("network.connectivity-service.enabled", false);
lockPref("browser.newtabpage.activity-stream.feeds.telemetry", false);
lockPref("browser.newtabpage.activity-stream.telemetry", false);
lockPref("browser.ping-centre.telemetry", false);
lockPref("toolkit.telemetry.coverage.opt-out", true);
lockPref("dom.security.https_only_mode", true);
lockPref("dom.security.https_first", true);
lockPref("dom.security.https_first_pbm", true);
lockPref("geo.enabled", false);
lockPref("browser.uitour.enabled", false);
lockPref("browser.discovery.enabled", false);
lockPref("extensions.getAddons.showPane", false);
// The IRN paste guard (paste-guard@irn.local) is our own add-on, installed by
// policy from a root-owned path, and it is not signed by Mozilla. Only ESR,
// Developer Edition and Nightly honour this pref; release Firefox ignores it and
// simply will not load the guard (irn-browser --doctor says so). The cost, on
// ESR: Firefox stops checking Mozilla's signature on EVERY add-on, so an
// unsigned .xpi you install by hand would load too. Add-ons from AMO still
// arrive over HTTPS from addons.mozilla.org as before.
lockPref("xpinstall.signatures.required", false);
lockPref("browser.contentblocking.category", "strict");
lockPref("privacy.annotate_channels.strict_list.enabled", true);

// --- URL tracking-parameter stripping ----------------------------------------
// Firefox's built-in query stripping (utm_*, fbclid, gclid, ...). On in normal
// windows too, not just private — a URL pasted into a filing or a FOIA request
// should not carry the campaign tag that says where you found it.
lockPref("privacy.query_stripping.enabled", true);
lockPref("privacy.query_stripping.enabled.pbmode", true);
lockPref("privacy.query_stripping.strip_on_share.enabled", true);

// --- Referer: tell the destination less --------------------------------------
// 2 = cross-origin referers are trimmed to scheme+host+port (no path, no query).
// Same-origin referers are untouched, so logins and payment flows still work.
lockPref("network.http.referer.XOriginTrimmingPolicy", 2);
lockPref("network.http.referer.defaultPolicy", 2);
lockPref("network.http.referer.defaultPolicy.pbmode", 2);

// --- No speculative or prefetched connections --------------------------------
// Every one of these is a request to a host you never chose to visit.
lockPref("network.prefetch-next", false);
lockPref("network.dns.disablePrefetch", true);
lockPref("network.dns.disablePrefetchFromHTTPS", true);
lockPref("network.predictor.enabled", false);
lockPref("network.predictor.enable-prefetch", false);
lockPref("browser.urlbar.speculativeConnect.enabled", false);
lockPref("browser.places.speculativeConnect.enabled", false);

// --- Transport ---------------------------------------------------------------
lockPref("security.tls.version.min", 3);              // TLS 1.2 floor
lockPref("security.ssl.require_safe_negotiation", true);
lockPref("network.dns.echconfig.enabled", true);      // Encrypted Client Hello
lockPref("network.dns.http3_echconfig.enabled", true);
lockPref("security.cert_pinning.enforcement_level", 2);

// --- Search bar keystrokes ---------------------------------------------------
lockPref("browser.search.suggest.enabled", false);
lockPref("browser.urlbar.suggest.searches", false);
lockPref("browser.urlbar.suggest.quicksuggest.sponsored", false);
lockPref("browser.urlbar.suggest.quicksuggest.nonsponsored", false);
lockPref("browser.fixup.alternate.enabled", false);   // don't guess www.<typo>.com

// --- No saved credentials or form text ---------------------------------------
lockPref("signon.rememberSignons", false);
lockPref("signon.autofillForms", false);
lockPref("browser.formfill.enable", false);
lockPref("extensions.formautofill.addresses.enabled", false);
lockPref("extensions.formautofill.creditCards.enabled", false);

// --- PDFs are hostile documents ----------------------------------------------
// Court and agency PDFs arrive from people who are not on your side. Render them
// in pdf.js (sandboxed, no Acrobat) and never execute embedded JavaScript.
lockPref("pdfjs.disabled", false);
lockPref("pdfjs.enableScripting", false);

// --- Downloads ---------------------------------------------------------------
// Nothing lands on disk silently, and nothing auto-opens by content type.
lockPref("browser.download.useDownloadDir", false);
lockPref("browser.download.always_ask_before_handling_new_types", true);
lockPref("browser.download.start_downloads_in_tmp_dir", true);

// =============================================================================
// First-run quiet
// =============================================================================
defaultPref("browser.aboutwelcome.enabled", false);
defaultPref("browser.messaging-system.whatsNewPanel.enabled", false);
defaultPref("datareporting.policy.dataSubmissionEnabled", false);
defaultPref("browser.shell.checkDefaultBrowser", false);

// =============================================================================
// Container tabs — one identity per matter
// =============================================================================
// Containers give each container its own cookie jar, storage and login session.
// Open the county clerk in one, the agency FOIA portal in another, personal mail
// in a third, and none of them can correlate the others. Multi-Account
// Containers (policies.json) adds per-site auto-assignment on top.
defaultPref("privacy.userContext.enabled", true);
defaultPref("privacy.userContext.ui.enabled", true);
defaultPref("privacy.userContext.newTabContainerOnLeftClick.enabled", true);

// =============================================================================
// WebRTC local-IP leak
// =============================================================================
// WebRTC can reveal your LAN/host IPs to a page even behind a VPN. Keep the
// feature working (video calls, Jitsi) but stop it handing out local candidates:
// advertise only the default route, never host/mDNS candidates.
lockPref("media.peerconnection.ice.default_address_only", true);
lockPref("media.peerconnection.ice.no_host", true);
lockPref("media.peerconnection.ice.proxy_only_if_behind_proxy", true);

// =============================================================================
// Home page: the IRN command center
// =============================================================================
// Belt-and-suspenders with the Homepage policy: force the START page to the home
// page even if this profile was set to restore the previous session (the policy
// alone doesn't always win over an existing session-restore choice). The path is
// rewritten to the per-user file by install-irn-browser.sh on a daily driver;
// the IRN OS image keeps this /usr/local path.
defaultPref("browser.startup.page", 1);
defaultPref("browser.startup.homepage", "file:///usr/local/share/irn-browser/newtab.html");

// =============================================================================
// Leave less on disk
// =============================================================================
// No on-disk HTTP cache — keep it in RAM. A privacy win everywhere; the
// --ephemeral profile (see the irn-browser wrapper) goes further and keeps the
// WHOLE profile in RAM so a poweroff/panic erases the session with no trace.
lockPref("browser.cache.disk.enable", false);
lockPref("browser.cache.disk_cache_ssl", false);
lockPref("browser.cache.memory.enable", true);
lockPref("browser.sessionstore.privacy_level", 2);   // never persist form/scroll for https
lockPref("browser.helperApps.deleteTempFileOnExit", true);

// =============================================================================
// Reading — this browser is used to read long documents
// =============================================================================
defaultPref("reader.parse-on-load.enabled", true);
defaultPref("findbar.highlightAll", true);
defaultPref("browser.tabs.loadBookmarksInTabs", true);
defaultPref("browser.tabs.insertRelatedAfterCurrent", true);
defaultPref("accessibility.typeaheadfind.flashBar", 0);

// =============================================================================
// Zee Zee in the sidebar
// =============================================================================
// Firefox 133+ ships a native "AI chatbot" sidebar that is simply a browser
// pointed at a provider URL. Read from Firefox 153's own GenAI code:
//
//     const { header, queryParam = "q" } = this.chatProviders.get(provider) ?? {};
//     url.searchParams.set(queryParam, prompt);
//
// A provider not in Firefox's built-in map falls through `?? {}`, so queryParam
// defaults to "q" and getProviderId() reports "custom". That is the entire
// contract — which means Zee Zee gets a REAL native sidebar with no extension,
// no Mozilla signing, and no patched binary.
//
// The provider is `irn-zee serve`, bound to 127.0.0.1 only. The irn-browser
// wrapper starts it on launch and `irn-browser --panic` stops it. If it is not
// running the sidebar shows a connection error and nothing else breaks.
//
// Loopback is exempt from HTTPS-only upgrades (upgrade_local defaults false, set
// explicitly below), so http://127.0.0.1 works despite HttpsOnlyMode being forced.
defaultPref("browser.ml.chat.enabled", true);
defaultPref("browser.ml.chat.provider", "http://127.0.0.1:8788/");
defaultPref("browser.ml.chat.hideLocalhost", false);   // default true hides local providers
defaultPref("browser.ml.chat.sidebar", true);
defaultPref("browser.ml.chat.menu", true);             // right-click → Ask Zee Zee
defaultPref("browser.ml.chat.shortcuts", true);        // selection popup
lockPref("dom.security.https_only_mode.upgrade_local", false);
// Only consulted when the revamped sidebar is on (sidebar.revamp defaults false);
// harmless otherwise, and it means the chatbot is present either way.
defaultPref("sidebar.main.tools", "aichat,history,bookmarks");

// Nothing here opts into Mozilla's own AI features: no remote model downloads
// (browser.ml.enable stays at its default), no data to Mozilla. The only model
// involved is the one already running on this machine.
