# IRN OS runtime kernel hardening. Complements 99-irn-harden.conf (written by
# the 0100-irn-harden hook: kptr_restrict, dmesg_restrict, suid_dumpable, ptrace).
# Checked by /usr/local/sbin/irn-verify-kernel-hardening.

# kexec replaces the running kernel without a reboot, which is a lockdown bypass
# path. The kexec-tools service is already disabled; this closes the syscall.
kernel.kexec_load_disabled = 1

# BPF: no unprivileged programs (1 = permanent until reboot), harden the JIT.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# No kernel profiling for unprivileged users (Debian supports level 3).
kernel.perf_event_paranoid = 3

# Stop unprivileged users from auto-loading rarely used TTY line disciplines.
dev.tty.ldisc_autoload = 0

# userfaultfd from unprivileged code is a common kernel-exploit helper.
vm.unprivileged_userfaultfd = 0

# Magic SysRq lets anyone at the keyboard dump memory state or kill processes,
# bypassing the session lock. Duress wipes go through /run/irn/panic, not SysRq.
kernel.sysrq = 0

# Block opening FIFOs and regular files owned by others in world-writable sticky
# directories like /tmp (spoofing and data-injection attacks).
fs.protected_fifos = 2
fs.protected_regular = 2
fs.protected_symlinks = 1
fs.protected_hardlinks = 1

# Deliberately NOT set:
#   kernel.unprivileged_userns_clone / user.max_user_namespaces = 0
#     WebKitGTK (Sanctuary's Tauri webview) sandboxes itself with bubblewrap,
#     which needs user namespaces. Disabling them would remove that sandbox.
#   kernel.modules_disabled = 1
#     Blocks loading ANY module after boot, which breaks hotplugged USB wifi,
#     storage, and the USB dead-man token. Lockdown already forces signed modules.
