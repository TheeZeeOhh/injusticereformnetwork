# IRN OS greetd overrides.
#
# 1. VT OWNERSHIP. greetd runs on vt1 (see /etc/greetd/config.toml -> [terminal]).
#    Debian's shipped unit declares its conflict against getty@tty7, because
#    Debian's stock greetd config uses vt7. We use vt1 so the desktop comes up on
#    the VT the machine already boots to — no text console flashing past, no VT
#    switch. Without this, greetd and live-config's autologin getty both grab vt1
#    and scribble over each other. greetd.5 recommends exactly this
#    ("Conflicts=getty@ttyN.service"). The harden hook also masks getty@tty1;
#    this is the safety net if anyone unmasks it. Consoles stay on Ctrl+Alt+F2-F6.
#
# 2. RUNTIME CONFIG. Point greetd at a config generated at boot, so autologin is
#    only configured when the `irn` user exists (live image) and never on an
#    installed system, where Calamares created a different account.
[Unit]
After=getty@tty1.service
Conflicts=getty@tty1.service
# The generator below asks whether the `irn` user exists, and on the live image
# it is live-config that creates it. Ordering already holds (live-config is
# Before=basic.target, greetd starts after), but state it rather than rely on it.
# On an installed system this unit does not exist and the ordering is a no-op.
After=live-config.service

[Service]
ExecStartPre=/usr/local/bin/irn-greetd-config
ExecStart=
ExecStart=/usr/sbin/greetd --config /run/greetd/config.toml
