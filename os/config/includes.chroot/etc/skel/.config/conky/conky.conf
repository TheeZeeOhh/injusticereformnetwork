--[[
Cyberpunk Neon HUD -- System Core (right panel).

Ported from Aziza's Garuda box into IRN OS. The look is unchanged; what changed
is everything that was hardcoded to that one laptop, because this image runs on
donated and varied hardware:

  * BAT1            -> irn-conky-battery detects BAT0/BAT1/none
  * cpu1..cpu8      -> irn-conky-cores emits exactly nproc rows
  * /home/aziza/... -> helpers live in /usr/local/libexec, readable by any user

Those blocks come through ${execpi}, which RE-PARSES conky variables in a
script's output -- conky has no loop construct, so this is the only way to size
a block to the machine it is actually running on.

Runs only in the Cinnamon (X11) session: conky's desktop-window modes do not
work under Wayland even through XWayland, which is why IRN OS ships X11 at all.

Shows MACHINE state only -- no vault, no records, nothing derived from client
data. A desktop widget is a shoulder-surfable surface.
]]

conky.config = {
    alignment = 'bottom_right',
    background = false,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = '#ece8f5',
    color1 = '#00f3ff', -- Cyber Cyan
    color2 = '#c9a84c', -- Gold
    color3 = '#9d00ff', -- Neon Purple
    color4 = '#00ff66', -- Neon Green
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'JetBrains Mono:size=9',
    gap_x = 30,
    gap_y = 30,
    minimum_height = 5,
    minimum_width = 300,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_wayland = false,
    out_to_x = true,

    -- Semi-transparent dark background for HUD look
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_colour = '#090514',
    own_window_argb_visual = true,
    own_window_argb_value = 160, -- Translucent
    own_window_hints = 'undecorated,sticky,below,skip_taskbar,skip_pager',

    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    temperature_unit = 'fahrenheit',
    update_interval = 1.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
}

conky.text = [[
${color2}[ SYSTEM OVERVIEW ]${color1}${alignr}IRN OS
${color3}${hr 2}
${color1}Uptime:${color} ${alignr}$uptime
${color1}System:${color} ${alignr}$sysname $kernel
${color1}CPU Temp:${color} ${alignr}${acpitemp}°F
${color1}Load:${color} ${alignr}${loadavg}
${color1}Processes:${color} ${alignr}$processes (${color4}$running_processes${color} running)
${color1}Entropy:${color} ${alignr}${entropy_avail} / ${entropy_poolsize}
${color3}${hr 1}
${execpi 30 /usr/local/libexec/irn-conky-battery}
${color3}${hr 1}
${color2}CORE MATRIX ${alignr}${color1}${freq_g}GHz
${execpi 300 /usr/local/libexec/irn-conky-cores}
${color3}${hr 1}
${color2}CPU AGGREGATE ${alignr}${cpu}%
${color1}${cpubar 5}
${color1}${cpugraph 26,300 00f3ff c9a84c -t}
${color3}${hr 1}
${color2}GPU LOAD ${alignr}${execi 1 /usr/local/libexec/irn-conky-gpu-stats busy}%
${color1}${execibar 1 /usr/local/libexec/irn-conky-gpu-stats busy}
${color1}VRAM:${color} ${alignr}${execi 2 /usr/local/libexec/irn-conky-gpu-stats vram_text}
${color3}${execibar 2 /usr/local/libexec/irn-conky-gpu-stats vram_pct}
${color1}GPU Temp:${color} ${alignr}${execi 2 /usr/local/libexec/irn-conky-gpu-stats temp}°F
${color1}Fan:${color} ${alignr}${execi 5 cat /sys/class/hwmon/hwmon*/fan1_input 2>/dev/null | head -1 || echo 0} RPM
${color3}${hr 1}
${color2}MEMORY SPACE ${alignr}${memperc}%
${color1}RAM:${color} ${mem}/${memmax} ${alignr}${color1}Swap:${color} $swap/$swapmax
${color3}${membar 5}
${color3}${hr 1}
${color2}TOP PROCESSES ${alignr}CPU%
${color3}${hr 1}
${color1} ${top name 1}${alignr}${top cpu 1}%
${color1} ${top name 2}${alignr}${top cpu 2}%
${color1} ${top name 3}${alignr}${top cpu 3}%
${color1} ${top name 4}${alignr}${top cpu 4}%
${color1} ${top name 5}${alignr}${top cpu 5}%
${color3}${hr 1}
${color2}MEM HOGS ${alignr}MEM%
${color1} ${top_mem name 1}${alignr}${top_mem mem 1}%
${color1} ${top_mem name 2}${alignr}${top_mem mem 2}%
${color1} ${top_mem name 3}${alignr}${top_mem mem 3}%
${color3}${hr 2}
${color2}TIME ENGINE${color1}${alignr}${font JetBrains Mono:size=16:bold}${time %H:%M:%S}${font}
${color1}DATE STAMP${alignr}${time %A, %d %B %Y}
]]
