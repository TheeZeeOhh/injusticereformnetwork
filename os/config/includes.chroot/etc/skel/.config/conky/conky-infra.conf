--[[
Cyberpunk Neon HUD -- Infrastructure Panel (left).

Ported from Aziza's Garuda box. Same look; the machine-specific and
privacy-relevant parts were changed:

  * wlo1 / tailscale0  -> irn-conky-net detects the real interface, and reports
                          the WireGuard tunnel irn-vpn manages. Tailscale is not
                          shipped: no third-party mesh, no account, nothing that
                          phones out.
  * nvme0n1            -> irn-conky-disk resolves the device backing /
  * docker             -> irn-conky-fleet lists containers where Docker exists,
                          otherwise the local IRN services
  * /home rows         -> shown only when /home is a separate mount (it is not on
                          the live image, and duplicate root figures read as a bug)
  * pactl              -> irn-conky-vol uses wpctl; IRN OS ships wireplumber,
                          not pulseaudio-utils

  * wttr.in WEATHER    -> REMOVED. It was an outbound HTTPS request every 15
                          minutes to a third party, which hands that party the
                          box's IP and coarse location on an OS whose whole claim
                          is that nothing leaves the device. Re-enable knowingly
                          or not at all; the original line is kept commented at
                          the bottom of this file.
]]

conky.config = {
    alignment = 'bottom_left',
    background = false,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = '#ece8f5',
    color1 = '#00f3ff', -- Cyber Cyan
    color2 = '#c9a84c', -- Gold
    color3 = '#9d00ff', -- Neon Purple
    color4 = '#00ff66', -- Neon Green
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'JetBrains Mono:size=9',
    gap_x = 30,
    gap_y = 30,
    minimum_height = 5,
    minimum_width = 300,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_wayland = false,
    out_to_x = true,

    -- Semi-transparent dark background -- matching the system panel
    own_window = true,
    own_window_class = 'ConkyInfra',
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_colour = '#090514',
    own_window_argb_visual = true,
    own_window_argb_value = 160,
    own_window_hints = 'undecorated,sticky,below,skip_taskbar,skip_pager',

    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 1.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
}

conky.text = [[
${color2}[ INFRASTRUCTURE ]${color1}${alignr}IRN NETWORK
${color3}${hr 2}
${execpi 10 /usr/local/libexec/irn-conky-fleet}
${color3}${hr 2}
${color2}OLLAMA CORTEX ${alignr}${execi 30 ollama ps 2>/dev/null | tail -n +2 | wc -l} Loaded
${color3}${hr 1}
${color1}${execi 30 ollama ps --format '{{.Name}}  {{.Size}}' 2>/dev/null | head -4 || echo " No models loaded"}
${color3}${hr 2}
${color2}STORAGE CYCLES ${alignr}${fs_used_perc /}%
${execpi 60 /usr/local/libexec/irn-conky-storage}
${color3}${hr 1}
${color2}DISK I/O
${execpi 60 /usr/local/libexec/irn-conky-disk}
${color3}${hr 2}
${execpi 30 /usr/local/libexec/irn-conky-net}
${color3}${hr 2}
${color2}AUDIO ${alignr}${execi 2 /usr/local/libexec/irn-conky-vol}%
${color1}${execibar 2 /usr/local/libexec/irn-conky-vol}
${color2}NOW PLAYING
${color4}${execi 3 playerctl metadata --format '{{artist}} - {{title}}' 2>/dev/null || echo "Silence..."}
]]

--[[
Removed for privacy -- an outbound call to a third party every 15 minutes:

${color2}WEATHER ${alignr}${execi 900 curl -s 'wttr.in/?format=%c+%t' 2>/dev/null || echo "offline"}
]]
