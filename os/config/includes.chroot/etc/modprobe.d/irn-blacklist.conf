# IRN OS: kernel modules that must never load.
#
# `install <module> /bin/false` blocks both automatic AND explicit loading;
# a plain `blacklist` line only stops autoloading by alias.
# Every module here was confirmed present in the 7.1.8 backports kernel
# (2026-09-13), so these lines are not dead weight.
# Checked by /usr/local/sbin/irn-verify-kernel-hardening.

# FireWire: DMA-capable port, obsolete on anything this image targets.
install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false

# Obscure network protocols with long CVE histories and no IRN use.
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install atm /bin/false
install can /bin/false
install n_hdlc /bin/false

# Rare filesystems that auto-mount from a plugged-in device: a crafted image is a
# kernel attack. udf and hfsplus stay allowed (DVDs, Mac-formatted drives).
install freevxfs /bin/false
install jffs2 /bin/false

# Virtual video test driver: never needed, repeatedly exploitable.
install vivid /bin/false

# Deliberately NOT blocked:
#   thunderbolt: modern USB-C docks and external displays depend on it. DMA
#     through the port is handled by iommu.strict in /etc/irn/kernel-cmdline.
#   bluetooth: the image ships bluez and blueman on purpose (audio).
