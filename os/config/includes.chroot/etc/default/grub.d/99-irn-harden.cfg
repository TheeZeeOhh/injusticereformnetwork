# Carry IRN OS kernel hardening into INSTALLED systems.
#
# live-build's --bootappend-install does not reach a Calamares install: Calamares
# writes its own /etc/default/grub. grub-mkconfig sources this drop-in after that
# file, so the parameters survive installs and later update-grub runs.
#
# GRUB_CMDLINE_LINUX (not _DEFAULT) so the recovery entries are hardened too.
# The parameters live in /etc/irn/kernel-cmdline; edit them there, not here.
IRN_KERNEL_CMDLINE="$(grep -v '^[[:space:]]*#' /etc/irn/kernel-cmdline 2>/dev/null | tr '\n' ' ' | tr -s ' ')"
GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:+$GRUB_CMDLINE_LINUX }${IRN_KERNEL_CMDLINE}"
