name: Build desktop app

# Builds the Sanctuary desktop app on real OS runners — notably Windows, which
# cannot be cross-built from the Linux/Arch dev box. Download the installers from
# the run's Artifacts, or (on a version tag like v0.1.0) from the auto-created
# GitHub Release.
#
# NOTE: CI proves it COMPILES and bundles. The security-critical subsystems
# (keychain -> Windows Credential Manager, USB dead-man's switch -> WinUSB) are
# still only runtime-verified on Linux; they must be tested on a real Windows
# machine (see deploy/windows/BUILD-WINDOWS.md).

on:
  push:
    branches: [sanctuary-app, main]
    tags: ['v*']
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-22.04
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux needs the native libs Tauri links (WebKitGTK, libusb, libsecret).
      - name: Install Linux system deps
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libusb-1.0-0-dev \
            libsecret-1-dev build-essential curl wget file libssl-dev \
            libgtk-3-dev librsvg2-dev

      - name: Install frontend deps
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build the app (tauri)
        run: npx tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: sanctuary-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: ignore

      # On a version tag, attach the installers to a GitHub Release.
      - name: Publish to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
