  &lt;h1&gt;Sanctuary — Cost-to-Build (Replacement) Valuation&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;A local-first, client-side-encrypted health &amp;amp; legal records platform for the Injustice Reform Network (IRN)&lt;/p&gt;
  &lt;p class=&quot;meta&quot;&gt;Prepared: 19 July 2026 &amp;nbsp;·&amp;nbsp; Basis: replacement / cost-to-build (professional engineering hours × market rate) &amp;nbsp;·&amp;nbsp; Prepared for IRN internal &amp;amp; grant use&lt;/p&gt;

  &lt;div class=&quot;callout&quot;&gt;
    &lt;strong&gt;Headline figure:&lt;/strong&gt; &lt;span class=&quot;big&quot;&gt;≈ $152,000 – $372,000&lt;/span&gt;&lt;br&gt;
    &lt;strong&gt;Conservative point estimate for grant/record use: ≈ $175,000.&lt;/strong&gt;
    This values the professional effort required to reproduce the software as it exists today. It is &lt;em&gt;not&lt;/em&gt; a market price and does &lt;em&gt;not&lt;/em&gt; assume the security design has been independently audited (see Risk &amp;amp; Discounts).
  &lt;/div&gt;

  &lt;h2&gt;1. Method&lt;/h2&gt;
  &lt;p&gt;
    The cost-to-build (a.k.a. replacement-cost) approach estimates what it would cost to have a qualified team re-create this system from scratch. It is the most defensible lens for a nonprofit sweat-equity / grant context because every figure ties to observable, delivered work rather than speculative market demand.
  &lt;/p&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;strong&gt;Inputs are measured, not guessed:&lt;/strong&gt; line counts, module counts, and the automated test suite were taken directly from the codebase.&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Estimated deliverable:&lt;/strong&gt; hours are assigned per work-domain, reflecting typical professional throughput for that &lt;em&gt;type&lt;/em&gt; of work (security-critical crypto is slower per line than CRUD UI).&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Rate:&lt;/strong&gt; a blended U.S. senior full-stack contractor rate of &lt;strong&gt;$95–$150/hr&lt;/strong&gt;, with a premium tier for the security/cryptography work.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h2&gt;2. Measured Scope (verified from the repository)&lt;/h2&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;~13,760&lt;/strong&gt; lines of source (JS/JSX, Rust, Node)&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;34&lt;/strong&gt; feature modules (React pages)&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;15&lt;/strong&gt; engine/utility libraries&lt;/li&gt;
    &lt;/ul&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;233&lt;/strong&gt; passing automated tests (34 test files, ~2,993 LOC)&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Rust (Tauri) shell:&lt;/strong&gt; ~452 LOC (keychain, USB dead-man's switch)&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;144&lt;/strong&gt; commits over ~3 months (Apr–Jul 2026)&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;h2&gt;3. Itemized Effort &amp;amp; Cost&lt;/h2&gt;

        &lt;th class=&quot;num&quot;&gt;Rate&lt;/th&gt;
        &lt;th class=&quot;num&quot;&gt;Low&lt;/th&gt;
        &lt;th class=&quot;num&quot;&gt;High&lt;/th&gt;
      &lt;/tr&gt;
    &lt;/thead&gt;

        &lt;td class=&quot;num&quot;&gt;~1,250&lt;/td&gt;
        &lt;td class=&quot;num&quot;&gt;280–420&lt;/td&gt;
        &lt;td class=&quot;num&quot;&gt;$130–160&lt;/td&gt;
        &lt;td class=&quot;num&quot;&gt;$36,400&lt;/td&gt;
        &lt;td class=&quot;num&quot;&gt;$67,200&lt;/td&gt;
      &lt;/tr&gt;

  &lt;div class=&quot;callout&quot;&gt;

  &lt;/div&gt;

  &lt;h2&gt;4. Why the security work carries a premium&lt;/h2&gt;
  &lt;p&gt;
    Roughly a quarter of the value sits in the cryptography, dual-vault, and Rust key-custody layers. This work is priced higher per hour and per line because errors are safety-critical (the platform's entire purpose is a &lt;em&gt;Technical Incapacity Defense&lt;/em&gt; — the operator must be unable to produce readable client PHI under subpoena). Comparable specialized security engineering commonly bills $130–200/hr and proceeds more slowly than feature CRUD.
  &lt;/p&gt;

  &lt;h2&gt;5. Risk &amp;amp; Discounts (read before citing a number)&lt;/h2&gt;
  &lt;div class=&quot;callout warn&quot;&gt;
    This valuation reflects &lt;strong&gt;effort to reproduce&lt;/strong&gt;, not &lt;strong&gt;certified correctness&lt;/strong&gt;. Two material caveats:
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;No independent security audit.&lt;/strong&gt; An internal adversarial review was done and its two CRITICAL findings fixed, but no third-party audit has occurred. A prudent buyer/funder would discount until an external review passes. This is also the single highest-leverage investment to &lt;em&gt;raise&lt;/em&gt; every figure here.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Prototype, not production.&lt;/strong&gt; Not yet runtime-QA'd end-to-end; the project's own documentation states real client PHI should not be entered until independently reviewed.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;h2&gt;6. How to cite this&lt;/h2&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;strong&gt;Grant / sweat-equity record:&lt;/strong&gt; &quot;Approximately $175,000 of professional-equivalent engineering has been invested to date (replacement-cost basis), supported by an itemized breakdown,&quot; with the audit caveat stated plainly.&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Do not&lt;/strong&gt; present the high end ($372K) as a settled value, or omit the un-audited-security caveat — both would weaken credibility under scrutiny.&lt;/li&gt;
    &lt;li&gt;This is a cost-to-build estimate, not a market/appraised value and not financial advice. For a board, insurance, or legal record, a licensed appraiser should review.&lt;/li&gt;
  &lt;/ul&gt;
