  &lt;h1&gt;Sanctuary — Pilot Readiness Checklist&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;Concrete steps between &quot;works on my machine&quot; and safe use with real client PHI&lt;/p&gt;
  &lt;p class=&quot;meta&quot;&gt;Prepared 19 July 2026 · Injustice Reform Network · Living document — update as items close&lt;/p&gt;

  &lt;div class=&quot;callout warn&quot;&gt;
    &lt;strong&gt;The hard line:&lt;/strong&gt; No item below is optional before &lt;em&gt;real client PHI&lt;/em&gt; is entered. Until Gate&amp;nbsp;A (independent audit) and Gate&amp;nbsp;B (runtime QA) are complete, use the app for &lt;strong&gt;demos, training, and dry-runs with fake/sample data only&lt;/strong&gt;. This mirrors the app's own stated posture.
  &lt;/div&gt;

  &lt;h2&gt;Gate A — Security assurance &lt;span class=&quot;gate g-block&quot;&gt;Blocks real PHI&lt;/span&gt;&lt;/h2&gt;
  &lt;p class=&quot;sub&quot;&gt;The single highest-leverage gate. Converts the security &lt;em&gt;design&lt;/em&gt; into an external &lt;em&gt;guarantee&lt;/em&gt;.&lt;/p&gt;
  &lt;ul class=&quot;check&quot;&gt;
    &lt;li&gt;Commission an &lt;strong&gt;independent, third-party security audit&lt;/strong&gt; (crypto + app + threat-model review by someone outside IRN)&lt;/li&gt;
    &lt;li&gt;Resolve or formally accept every finding; document decisions&lt;/li&gt;
    &lt;li&gt;Confirm the two internal CRITICAL fixes hold up under external review &lt;span class=&quot;tag t-partial&quot;&gt;internal review done&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Re-parameterize deferred items the audit will likely raise: Argon2id KDF, device-origin backup signing, hardware-bound Vault B&lt;/li&gt;
    &lt;li&gt;Obtain a written audit summary you can show funders / legal&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p class=&quot;note&quot;&gt;Status today: internal adversarial review complete (see SECURITY-AUDIT.md); &lt;strong&gt;no independent audit yet.&lt;/strong&gt;&lt;/p&gt;

  &lt;h2&gt;Gate B — End-to-end runtime QA &lt;span class=&quot;gate g-block&quot;&gt;Blocks real PHI&lt;/span&gt;&lt;/h2&gt;
  &lt;p class=&quot;sub&quot;&gt;Tests prove logic; a human must prove the running app behaves. Do this on the real desktop build with sample data.&lt;/p&gt;
  &lt;ul class=&quot;check&quot;&gt;
    &lt;li&gt;Click through &lt;strong&gt;every module&lt;/strong&gt; on the packaged desktop app, not just the dev server&lt;/li&gt;
    &lt;li&gt;Verify &lt;strong&gt;Vault B gating&lt;/strong&gt; live: HRT / 42 CFR data and HRT-refill alerts appear only when Vault B is unlocked; nothing leaks when closed&lt;/li&gt;
    &lt;li&gt;Verify &lt;strong&gt;PHI export paths&lt;/strong&gt; (Case Reporting PDF): warning fires, only intended fields export, file lands where expected&lt;/li&gt;
    &lt;li&gt;Verify &lt;strong&gt;panic close&lt;/strong&gt; drops the Vault B key and re-entry is required &lt;span class=&quot;tag t-done&quot;&gt;code + tests present&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Verify &lt;strong&gt;USB dead-man's switch&lt;/strong&gt; on real hardware (arm token, remove it, confirm keys drop) &lt;span class=&quot;tag t-partial&quot;&gt;Tauri-only, needs live test&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Confirm the per-client save→reload cycle for each PHI module (clients, notes, transcripts, stipends, referrals) persists correctly&lt;/li&gt;
    &lt;li&gt;Confirm on-device Whisper + Amina run with &lt;strong&gt;no network&lt;/strong&gt; after first model download&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h2&gt;Gate C — Data safety &amp;amp; recovery &lt;span class=&quot;gate g-block&quot;&gt;Blocks real PHI&lt;/span&gt;&lt;/h2&gt;
  &lt;ul class=&quot;check&quot;&gt;
    &lt;li&gt;Run a &lt;strong&gt;real backup → wipe → restore drill&lt;/strong&gt; and confirm zero data loss &lt;span class=&quot;tag t-partial&quot;&gt;no dedicated backup test file found — verify manually&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Document the &lt;strong&gt;Vault B unrecoverability&lt;/strong&gt; reality for staff: forgotten Vault B passphrase = permanent loss, by design&lt;/li&gt;
    &lt;li&gt;Define where encrypted backups are stored and who holds passphrases&lt;/li&gt;
    &lt;li&gt;Confirm keychain round-trip works on each operator's actual machine&lt;/li&gt;
    &lt;li&gt;Write a simple &lt;strong&gt;incident plan&lt;/strong&gt;: lost/stolen device, forgotten passphrase, suspected compromise&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h2&gt;Gate D — Operational &amp;amp; legal readiness &lt;span class=&quot;gate g-block&quot;&gt;Blocks real PHI&lt;/span&gt;&lt;/h2&gt;
  &lt;ul class=&quot;check&quot;&gt;
    &lt;li&gt;Confirm &lt;strong&gt;42 CFR Part 2 / HIPAA&lt;/strong&gt; obligations are met for the pilot's data and consent flows (legal sign-off)&lt;/li&gt;
    &lt;li&gt;Finalize &lt;strong&gt;client consent language&lt;/strong&gt; for on-device transcription and record-keeping&lt;/li&gt;
    &lt;li&gt;Written &lt;strong&gt;data-handling policy&lt;/strong&gt;: who unlocks which vault, when PDFs may be exported, device custody&lt;/li&gt;
    &lt;li&gt;Train navigators on the workflow with &lt;strong&gt;sample data&lt;/strong&gt; before any real client&lt;/li&gt;
    &lt;li&gt;Verify self-hosted Jitsi is configured if Telehealth is in scope (no public fallback by design)&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h2&gt;Safe to do &lt;em&gt;now&lt;/em&gt; (no gate needed) &lt;span class=&quot;gate g-do&quot;&gt;Green light&lt;/span&gt;&lt;/h2&gt;
  &lt;ul class=&quot;check&quot;&gt;
    &lt;li&gt;Demo to funders / board / partners using seeded sample clients&lt;/li&gt;
    &lt;li&gt;Navigator training and workflow dry-runs with fake data&lt;/li&gt;
    &lt;li&gt;Internal evaluation and feedback gathering&lt;/li&gt;
    &lt;li&gt;Continue feature work under the existing test + lint commit gate &lt;span class=&quot;tag t-done&quot;&gt;active&lt;/span&gt;&lt;/li&gt;
  &lt;/ul&gt;

  &lt;div class=&quot;callout&quot;&gt;
    &lt;strong&gt;Recommended sequence:&lt;/strong&gt; Gate B (runtime QA — you can start today) &amp;nbsp;→&amp;nbsp; Gate C (backup drill + incident plan) &amp;nbsp;→&amp;nbsp; Gate A (independent audit — the big external step) &amp;nbsp;→&amp;nbsp; Gate D (legal + consent) &amp;nbsp;→&amp;nbsp; limited live pilot with a small number of consenting clients &amp;nbsp;→&amp;nbsp; broader rollout.
  &lt;/div&gt;
